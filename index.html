<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MOON — Frontend Portfolio</title>
  <meta name="description" content="게임 콘솔 홈 화면에서 영감을 받은 프론트엔드 개발자 포트폴리오" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕹️</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- 부팅 스플래시 -->
  <div class="boot" id="boot" aria-hidden="true">
    <div class="boot__logo">
      <span class="boot__icon">🕹️</span>
      <span class="boot__text">MOON<em>PORTFOLIO</em></span>
    </div>
  </div>

  <div class="console" id="console">

    <!-- ── 상단 바 ─────────────────────────── -->
    <header class="topbar">
      <div class="topbar__brand">
        <span class="topbar__brand-icon">🌙</span>
        <span class="topbar__brand-text" id="topbar-brand"></span>
      </div>
      <div class="topbar__status">
        <span class="topbar__clock" id="clock">--:--</span>
        <span class="statusicon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 20a2 2 0 1 1 0-4 2 2 0 0 1 0 4Zm-5.6-5.2 2.1-2.1a5 5 0 0 1 7 0l2.1 2.1-1.4 1.4-2.1-2.1a3 3 0 0 0-4.2 0l-2.1 2.1-1.4-1.4ZM2.9 10.9 5 8.8a10 10 0 0 1 14 0l2.1 2.1-1.4 1.4L17.6 10a8 8 0 0 0-11.2 0l-2.1 2.3-1.4-1.4Z"/></svg>
        </span>
        <span class="statusicon battery" aria-hidden="true">
          <span class="battery__body"><span class="battery__fill"></span></span>
        </span>
      </div>
    </header>

    <!-- ── 게임 덱 ─────────────────────────── -->
    <main class="deck-area">
      <p class="deck-title" id="deck-title" aria-live="polite"></p>
      <div class="deck" id="deck" role="listbox" aria-label="메뉴"></div>
    </main>

    <!-- ── 하단 바 ─────────────────────────── -->
    <footer class="bottombar">
      <div class="bottombar__left">
        <button class="roundbtn" id="btn-theme" aria-label="테마 전환" title="테마 전환">
          <span class="roundbtn__icon" id="theme-icon">☀️</span>
        </button>
        <button class="roundbtn" id="btn-sound" aria-label="사운드 켜기/끄기" title="사운드">
          <span class="roundbtn__icon" id="sound-icon">🔊</span>
        </button>
      </div>
      <div class="bottombar__hints" aria-hidden="true">
        <span class="hint"><b class="key">◀ ▶</b> 이동</span>
        <span class="hint"><b class="key key--a">A</b> 결정</span>
        <span class="hint"><b class="key key--b">B</b> 뒤로</span>
      </div>
    </footer>
  </div>

  <!-- ── 프로젝트 상세 오버레이 ─────────────── -->
  <section class="screen" id="screen-game" aria-hidden="true">
    <div class="screen__inner" id="game-content"><!-- JS 렌더링 --></div>
  </section>

  <!-- ── 섹션 패널 오버레이 (홈/이력서/자기소개서/실무·개인 프로젝트 목록) ── -->
  <section class="screen" id="screen-panel" aria-hidden="true">
    <div class="screen__inner" id="panel-content"><!-- JS 렌더링 --></div>
  </section>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
