<!DOCTYPE html>
<html lang="ko" class="light">
    <!-- BEGIN: Head -->
    <head>
        <meta charset="utf-8" />
        <link href="dist/images/logo.svg" rel="shortcut icon" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="description" content="Midone admin is super flexible, powerful, clean & modern responsive tailwind admin template with unlimited possibilities." />
        <meta name="keywords" content="admin template, Midone Admin Template, dashboard template, flat admin template, responsive admin template, web app" />
        <meta name="author" content="LEFT4CODE" />
        <title>단호박 상담소 관리자</title>
        <!-- BEGIN: CSS Assets-->
        <link rel="stylesheet" href="dist/css/app.css" />
        <!-- END: CSS Assets-->
    </head>
    <!-- END: Head -->

    <body class="py-0 login_wrap">
        <div class="container sm:px-10">
            <div class="xl:grid grid-cols-1 gap-4 justify-center">
                <!-- BEGIN: Login Form -->
                <div class="h-screen flex py-5">
                    <div class="my-auto mx-auto bg-white dark:bg-darkmode-600 px-5 sm:px-8 py-8 rounded-md shadow-md sm:w-3/4 lg:w-2/4 xl:w-1/3 w-full">
                        <h2 class="intro-x font-bold text-2xl text-center">LOGIN</h2>

                        <ul class="nav nav-link-tabs mt-10 login_tab">
                            <li id="example-5-tab" class="nav-item flex-1" data-login="admin_login">
                                <button class="nav-link w-full py-2 active" type="button">관리자</button>
                            </li>
                            <li id="example-6-tab" class="nav-item flex-1" data-login="counselor_login">
                                <button class="nav-link w-full py-2" type="button">상담사</button>
                            </li>
                        </ul>

                        <div class="admin_login login_box">
                            <div class="intro-x mt-8">
                                <label for="" class="block text-slate-600">아이디</label>
                                <input type="text" class="intro-x login__input form-control py-3 px-4 block mt-1" placeholder="이메일" />
                                <label for="" class="block mt-4 text-slate-600">비밀번호</label>
                                <input type="password" class="intro-x login__input form-control py-3 px-4 block mt-1" placeholder="비밀번호" />
                            </div>

                            <div class="intro-x mt-5 xl:mt-8 text-center">
                                <button class="btn btn-primary py-3 px-4 w-full xl:mr-3 align-top">로그인</button>
                                <div class="mt-5 text-danger text-left text-xs">
                                    입력하신 아이디 또는 비밀번호가 일치하지 않습니다.<br />
                                    다시 한 번 확인해 주세요.
                                </div>
                            </div>
                        </div>
                        <div class="counselor_login login_box hidden">
                            <div class="intro-x mt-8">
                                <label for="" class="block text-slate-600">아이디</label>
                                <input type="text" class="intro-x login__input form-control py-3 px-4 block mt-1" placeholder="이메일" />
                                <label for="" class="block mt-4 text-slate-600">비밀번호</label>
                                <input type="password" class="intro-x login__input form-control py-3 px-4 block mt-1" placeholder="비밀번호" />
                            </div>

                            <div class="intro-x mt-5 xl:mt-8 text-center">
                                <button class="btn btn-primary py-3 px-4 w-full xl:mr-3 align-top">로그인</button>
                                <div class="mt-5 text-danger text-left text-xs">
                                    입력하신 아이디 또는 비밀번호가 일치하지 않습니다.<br />
                                    다시 한 번 확인해 주세요.
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- END: Login Form -->
            </div>
        </div>

        <!-- BEGIN: JS Assets-->
        <script src="dist/js/app.js"></script>
        <!-- END: JS Assets-->
    </body>
</html>
