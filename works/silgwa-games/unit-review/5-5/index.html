<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0 user-scalable=0" />
		<link rel="stylesheet" type="text/css" href="./common/css/font.css" />
		<title>QR콘텐츠</title>

		<style>
			html,
			body {
				padding: 0;
				height: 100%;
				margin: 0;
				overflow: hidden;
			}
			your-component {
				display: block;
				position: relative;
				width: 80%;
				height: 80%;
			}
		</style>
	</head>

	<body>
		<your-component></your-component>

		<template id="class--content">
			<div id="classStyudyContent" style="visibility: hidden">
				<!-- Content -->
				<div id="wrap" class="page unit5 class_5">
					<div id="container">
						<!-- 변경되는 컨텐츠 시작 -->

						<!-- 시작 페이지 -->
						<div id="start_page">
							<div class="start_btn_area">
								<img src="./img/intro_title.png" alt="" />
								<div class="intro_cha"></div>
								<button class="start_btn">시작하기</button>
							</div>
						</div>

						<!-- 인트로 페이지 -->
						<div id="intro_page" class="off">
							<button class="btn_sound"></button>
							<img src="./img/bg1_gif.gif" alt="인트로 GIF" />
							<div class="starting_title">
								<span
									>디지털 사회와<br />
									컴퓨터</span
								>
								<div class="title_mask"></div>
							</div>
						</div>

						<!-- 활동 페이지 -->
						<div class="action_page action_page01">
							<button class="btn_sound"></button>
							<div class="action_title">
								<span>빈칸에 들어갈 글자를 찾아봅시다.</span>
							</div>
							<div class="action_contents">
								<div class="slide-wrap" id="slider1">
									<div class="arrow left off" style="cursor: pointer"></div>

									<div class="slide slide-container">
										<!-- Slide 01 -->
										<div class="slide-item" id="drag1" data-pic-title="">
											<!-- 본문 텍스트 및 드롭 영역 -->
											<div class="contents_txt_wrap">
												<div class="contents_txt contents_txt01">
													<span class="grading_icon"></span>
													<div class="drop_area">
														<div class="drop_obj drop_obj01" data-ans="컴"></div>
														<div class="drop_obj drop_obj02" data-ans="퓨"></div>
														<div class="drop_obj drop_obj03" data-ans="터"></div>
													</div>
													은/는 입력된 정보를 정해진 과정대로 처리하고, <br />
													그 결과를 제공하는 기기를 말합니다.
												</div>

												<div class="contents_txt contents_txt02">
													문제 찾기에서는 문제 상황에 제시된 요소를 분석하여 현재 상태와
													<span class="grading_icon"></span>
													<div class="drop_area">
														<div class="drop_obj drop_obj01" data-ans="목"></div>
														<div class="drop_obj drop_obj02" data-ans="표"></div>
													</div>
													상태를 정의합니다.
												</div>
											</div>

											<!-- 드래그 영역 -->
											<div class="drag_area">
												<div class="item_wrap">
													<div class="drag_item drag_obj drag_obj01">컴</div>
												</div>
												<div class="item_wrap">
													<div class="drag_item drag_obj drag_obj02">순</div>
												</div>
												<div class="item_wrap">
													<div class="drag_item drag_obj drag_obj03">언</div>
												</div>
												<div class="item_wrap">
													<div class="drag_item drag_obj drag_obj04">터</div>
												</div>
												<div class="item_wrap">
													<div class="drag_item drag_obj drag_obj05">어</div>
												</div>
												<div class="item_wrap">
													<div class="drag_item drag_obj drag_obj06">퓨</div>
												</div>
												<div class="item_wrap">
													<div class="drag_item drag_obj drag_obj07">표</div>
												</div>
												<div class="item_wrap">
													<div class="drag_item drag_obj drag_obj08">목</div>
												</div>
												<div class="item_wrap">
													<div class="drag_item drag_obj drag_obj09">서</div>
												</div>
												<div class="item_wrap">
													<div class="drag_item drag_obj drag_obj10">도</div>
												</div>
											</div>

											<!-- 채점 버튼 및 캐릭터 -->
											<div class="grading_area">
												<button class="grading_btn">채점하기</button>
												<div class="cha"></div>
												<div class="bubble bubble01">
													<span
														>채점하기 전에 <br />
														답을 맞게 입력했는지 <br />
														확인해 보아요.
													</span>
												</div>
											</div>

											<div class="final_obj">
												<div class="final_cha"></div>
												<button class="final_btn">다 했어요</button>

												<div class="next_section_btn">
													<button class="next_action_btn">다음 활동하기</button>
												</div>
											</div>
										</div>
										<!-- Slide 02 -->
										<div class="slide-item" id="drag2" data-pic-title="">
											<!-- 본문 텍스트 및 드롭 영역 -->
											<div class="contents_txt_wrap">
												<div class="contents_txt contents_txt01">
													알고리즘은 자연어, <span class="grading_icon"></span>
													<div class="drop_area">
														<div class="drop_obj drop_obj01" data-ans="순"></div>
														<div class="drop_obj drop_obj02" data-ans="서"></div>
														<div class="drop_obj drop_obj03" data-ans="도"></div>
													</div>
													, 의사 코드 등의 표현 방법이 있습니다.
												</div>

												<div class="contents_txt contents_txt02">
													프로그래밍 <span class="grading_icon"></span>
													<div class="drop_area">
														<div class="drop_obj drop_obj01" data-ans="언"></div>
														<div class="drop_obj drop_obj02" data-ans="어"></div>
													</div>
													은/는 컴퓨터에게 명령하기 위해 만들어진 언어를 말합니다.
												</div>
											</div>

											<!-- 드래그 영역 -->
											<div class="drag_area">
												<div class="item_wrap">
													<div class="drag_item drag_obj drag_obj01">컴</div>
												</div>
												<div class="item_wrap">
													<div class="drag_item drag_obj drag_obj02">순</div>
												</div>
												<div class="item_wrap">
													<div class="drag_item drag_obj drag_obj03">언</div>
												</div>
												<div class="item_wrap">
													<div class="drag_item drag_obj drag_obj04">터</div>
												</div>
												<div class="item_wrap">
													<div class="drag_item drag_obj drag_obj05">어</div>
												</div>
												<div class="item_wrap">
													<div class="drag_item drag_obj drag_obj06">퓨</div>
												</div>
												<div class="item_wrap">
													<div class="drag_item drag_obj drag_obj07">표</div>
												</div>
												<div class="item_wrap">
													<div class="drag_item drag_obj drag_obj08">목</div>
												</div>
												<div class="item_wrap">
													<div class="drag_item drag_obj drag_obj09">서</div>
												</div>
												<div class="item_wrap">
													<div class="drag_item drag_obj drag_obj10">도</div>
												</div>
											</div>

											<!-- 채점 버튼 및 캐릭터 -->
											<div class="grading_area">
												<button class="grading_btn">채점하기</button>
												<div class="cha"></div>
												<div class="bubble bubble01">
													<span
														>채점하기 전에 <br />
														답을 맞게 입력했는지 <br />
														확인해 보아요.
													</span>
												</div>
											</div>

											<div class="final_obj">
												<div class="final_cha"></div>
												<button class="final_btn">다 했어요</button>

												<div class="next_section_btn">
													<button class="next_action_btn">다음 활동하기</button>
												</div>
											</div>
										</div>
									</div>

									<div class="arrow right" style="cursor: pointer"></div>
								</div>
							</div>

							<!-- 슬라이드 팝업 -->
							<div class="ui_pop" data-pop="slide_pop">
								<div class="inner">
									<div class="pop_title">
										<span>디지털 사회와 컴퓨터</span>
									</div>

									<div class="pop_slide_wrap">
										<button class="pop_slide_btn next"></button>
										<div class="pop_slide pop_slide01 active">
											<ul>
												<li>
													<span><span class="answer">컴퓨터</span>은/는 입력된 정보를 정해진 과정대로 처리하고, 그 결과를 제공하는 기기를 말합니다.<button class="magnifire_btn"></button></span>
												</li>
												<li>
													<span>문제 찾기에서는 문제 상황에 제시된 요소를 분석하고 현재 상태와 <span class="answer">목표</span> 상태를 구분합니다.<button class="magnifire_btn"></button></span>
												</li>
												<li>
													<span>알고리즘은 자연어, <span class="answer">순서도</span>, 의사 코드 등의 표현 방법이 있습니다.<button class="magnifire_btn"></button></span>
												</li>
											</ul>
										</div>
										<div class="pop_slide pop_slide02">
											<ul>
												<li>
													<span>프로그래밍 <span class="answer">언어</span>은/는 컴퓨터에게 명령하기 위해 만들어진 언어를 말합니다.<button class="magnifire_btn"></button></span>
												</li>
											</ul>
										</div>
										<button class="pop_slide_btn prev off"></button>
									</div>

									<button class="close"></button>
								</div>
							</div>
						</div>

						<!-- 활동2 페이지 -->
						<div class="action_page action_page02 off">
							<button class="btn_sound"></button>
							<div class="action_title">
								<span>이 단원에서 성취한 내용을 점검해 봅시다.</span>
								<button class="home_btn hide">처음으로</button>
							</div>
							<div class="action_contents">
								<div class="finger_ani"></div>
								<ul>
									<li>
										<label for="inspection01">
											<input type="checkbox" id="inspection01" />
											<span class="inspection_box"></span>
											<span class="inspection_txt">생활 속에서 컴퓨터가 활용되는 사례를 탐색하였어요. </span>
										</label>
									</li>
									<li>
										<label for="inspection02">
											<input type="checkbox" id="inspection02" />
											<span class="inspection_box"></span>
											<span class="inspection_txt">문제를 해결하기 위해 프로그래밍할 수 있어요. </span>
										</label>
									</li>
									<li>
										<label for="inspection03">
											<input type="checkbox" id="inspection03" />
											<span class="inspection_box"></span>
											<span class="inspection_txt">생활 속 문제를 해결하는 알고리즘을 구상하였어요. </span>
										</label>
									</li>
									<li>
										<label for="inspection04">
											<input type="checkbox" id="inspection04" />
											<span class="inspection_box"></span>
											<span class="inspection_txt">생활 속에서 컴퓨터를 활용해 해결 가능한 문제를 탐색해 보려는 태도를 가지게 되었어요. </span>
										</label>
									</li>
									<li>
										<label for="inspection05">
											<input type="checkbox" id="inspection05" />
											<span class="inspection_box"></span>
											<span class="inspection_txt"> 프로그래밍할 때 친구와 협력하였어요. </span>
										</label>
									</li>
								</ul>

								<!-- 페이지 업다운 버튼(텍스트 길어질 때) -->
								<!-- <div class="up_down_btn_wrap">
                  <button class="up_btn"></button>
                  <button class="down_btn"></button>
                </div> -->

								<div class="complete_obj hide">
									<button class="final_btn">다 했어요</button>
									<div class="final_cha02"></div>
								</div>
							</div>

							<!-- 토스트 팝업 -->
							<div class="toast_popup">
								<div class="inner">
									<span class="toast_popup_title">정말 다 했나요?</span>
									<div class="btn_wrap">
										<button class="yes_btn">네</button>
										<button class="no_btn">아니요</button>
									</div>
								</div>
							</div>

							<div class="complete_bg">
								<img src="./img/complete_bg.gif" alt="팡파레 GIF" />
								<div class="complete_stamp"></div>
								<p class="complete-comment"></p>
							</div>
						</div>

						<!-- 변경되는 컨텐츠 끝 -->
					</div>
				</div>
			</div>

			<!-- 복수개의 스타일 가능 -->
			<link rel="stylesheet" type="text/css" href="./common/css/common.css" />
			<link rel="stylesheet" type="text/css" href="./css/common.css" />
			<link rel="stylesheet" type="text/css" href="./css/variable.css" />

			<!-- 복수개의 스크립트 파일 가능 -->
			<script type="text/javascript" src="./common/js/jquery-3.4.1.min.js"></script>
			<script type="text/javascript" src="./common/js/jquery-ui.js"></script>
			<script type="text/javascript" src="./common/js/jquery.ui.touch-punch.min.js"></script>
			<script type="text/javascript" src="./common/js/base.js"></script>
			<script type="text/javascript" src="./common/js/view.js"></script>
			<script type="text/javascript" src="./common/js/lib.js"></script>
			<script type="text/javascript" src="./common/js/audioPlayer.js"></script>
			<script type="text/javascript" src="./common/js/common.js"></script>
			<script type="text/javascript" src="./js/sound.js"></script>
			<script type="text/javascript" src="./js/drag.js"></script>
			<script type="text/javascript" src="./js/scripts.js"></script>
		</template>

		<script type="module" src="./common/js/shadow-dom-your.js"></script>
