<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0 user-scalable=0" />
		<link rel="stylesheet" type="text/css" href="./common/css/font.css" />
		<title>QR콘텐츠</title>

		<style>
			html,
			body {
				padding: 0;
				height: 100%;
				margin: 0;
				overflow: hidden;
			}
			your-component {
				display: block;
				position: relative;
				width: 80%;
				height: 80%;
			}
		</style>
	</head>

	<body>
		<your-component></your-component>

		<template id="class--content">
			<div id="classStyudyContent" style="visibility: hidden">
				<!-- Content -->
				<div id="wrap" class="page unit3 class_5">
					<div id="container">
						<!-- 변경되는 컨텐츠 시작 -->

						<!-- 시작 페이지 -->
						<div id="start_page">
							<div class="start_btn_area">
								<img src="./img/intro_title.png" alt="" />
								<div class="intro_cha"></div>
								<button class="start_btn">시작하기</button>
							</div>
						</div>

						<!-- 인트로 페이지 -->
						<div id="intro_page" class="off">
							<button class="btn_sound"></button>
							<img src="./img/bg1_gif.gif" alt="인트로 GIF" />
							<div class="starting_title">
								<!-- 단원명 -->
								<span
									>지속가능한<br />
									의식주 생활</span
								>
								<div class="title_mask"></div>
							</div>
						</div>

						<!-- 활동 페이지 -->
						<div class="action_page action_page01">
							<button class="btn_sound"></button>
							<div class="action_title">
								<span>빈칸에 들어갈 글자를 찾아봅시다.</span>
							</div>
							<div class="action_contents">
								<div class="slide-wrap" id="slider1">
									<div class="arrow left off" style="cursor: pointer"></div>

									<div class="slide slide-container">
										<!-- Slide 01 -->
										<div class="slide-item" id="drag1" data-pic-title="">
											<!-- 본문 텍스트 및 드롭 영역 -->
											<div class="contents_txt_wrap">
												<div class="contents_txt contents_txt01">
													<span class="grading_icon"></span>
													제한된
													<div class="drop_area">
														<div class="drop_obj drop_obj01" data-ans="생"></div>
														<div class="drop_obj drop_obj02" data-ans="활" style="margin-right: 24px"></div>
														<div class="drop_obj drop_obj03" data-ans="자"></div>
														<div class="drop_obj drop_obj04" data-ans="원" style="margin-right: -12px"></div>
													</div>
													은/는 합리적으로 보관하고 활용해야 <br />
													사용 가치를 높일 수 있습니다.
												</div>

												<div class="contents_txt contents_txt02">
													<span class="grading_icon"></span>
													생활 공간을 쾌적하게 관리하기 위해서는 정리
													<div class="drop_area">
														<div class="drop_obj drop_obj01" data-ans="정"></div>
														<div class="drop_obj drop_obj02" data-ans="돈" style="margin-right: -12px"></div>
													</div>
													한 뒤 청소해야 합니다.
												</div>
											</div>

											<!-- 드래그 영역 -->
											<div class="drag_area">
												<div class="item_wrap">
													<div class="drag_item drag_obj drag_obj01">자</div>
												</div>
												<div class="item_wrap">
													<div class="drag_item drag_obj drag_obj02">단</div>
												</div>
												<div class="item_wrap">
													<div class="drag_item drag_obj drag_obj03">원</div>
												</div>
												<div class="item_wrap">
													<div class="drag_item drag_obj drag_obj04">식</div>
												</div>
												<div class="item_wrap">
													<div class="drag_item drag_obj drag_obj05">돈</div>
												</div>
												<div class="item_wrap">
													<div class="drag_item drag_obj drag_obj06">수</div>
												</div>
												<div class="item_wrap">
													<div class="drag_item drag_obj drag_obj07">나</div>
												</div>
												<div class="item_wrap">
													<div class="drag_item drag_obj drag_obj08">생</div>
												</div>
												<div class="item_wrap">
													<div class="drag_item drag_obj drag_obj09">정</div>
												</div>
												<div class="item_wrap">
													<div class="drag_item drag_obj drag_obj10">선</div>
												</div>
												<div class="item_wrap">
													<div class="drag_item drag_obj drag_obj11">활</div>
												</div>
												<div class="item_wrap">
													<div class="drag_item drag_obj drag_obj12">사</div>
												</div>
											</div>

											<!-- 채점 버튼 및 캐릭터 -->
											<div class="grading_area">
												<button class="grading_btn">채점하기</button>
												<div class="cha"></div>
												<div class="bubble bubble01">
													<span
														>채점하기 전에 <br />
														답을 맞게 입력했는지 <br />
														확인해 보아요.
													</span>
												</div>
											</div>

											<div class="final_obj">
												<div class="final_cha"></div>
												<button class="final_btn">다 했어요</button>

												<div class="next_section_btn">
													<button class="next_action_btn">다음 활동하기</button>
												</div>
											</div>
										</div>
										<!-- Slide 02 -->
										<div class="slide-item" id="drag2" data-pic-title="">
											<!-- 본문 텍스트 및 드롭 영역 -->
											<div class="contents_txt_wrap">
												<div class="contents_txt contents_txt01">
													<span class="grading_icon"></span>
													스스로 간식이나
													<div class="drop_area">
														<div class="drop_obj drop_obj01" data-ans="식"></div>
														<div class="drop_obj drop_obj02" data-ans="사" style="margin-right: -12px"></div>
													</div>
													을/를 마련하면 좀 더 건강에 좋은 음식을 선택하여 균형 잡힌 식사를 할 수 있습니다.
												</div>

												<div class="contents_txt contents_txt02">
													<span class="grading_icon"></span>
													단추가 떨어졌거나 옷이 찢어졌을 때 바느질을 하여 고치는 것을
													<div class="drop_area">
														<div class="drop_obj drop_obj01" data-ans="수"></div>
														<div class="drop_obj drop_obj02" data-ans="선" style="margin-right: -12px"></div>
													</div>
													(이)라고 합니다.
												</div>
											</div>

											<!-- 드래그 영역 -->
											<div class="drag_area">
												<div class="item_wrap">
													<div class="drag_item drag_obj drag_obj01">자</div>
												</div>
												<div class="item_wrap">
													<div class="drag_item drag_obj drag_obj02">단</div>
												</div>
												<div class="item_wrap">
													<div class="drag_item drag_obj drag_obj03">원</div>
												</div>
												<div class="item_wrap">
													<div class="drag_item drag_obj drag_obj04">식</div>
												</div>
												<div class="item_wrap">
													<div class="drag_item drag_obj drag_obj05">돈</div>
												</div>
												<div class="item_wrap">
													<div class="drag_item drag_obj drag_obj06">수</div>
												</div>
												<div class="item_wrap">
													<div class="drag_item drag_obj drag_obj07">나</div>
												</div>
												<div class="item_wrap">
													<div class="drag_item drag_obj drag_obj08">생</div>
												</div>
												<div class="item_wrap">
													<div class="drag_item drag_obj drag_obj09">정</div>
												</div>
												<div class="item_wrap">
													<div class="drag_item drag_obj drag_obj10">선</div>
												</div>
												<div class="item_wrap">
													<div class="drag_item drag_obj drag_obj11">활</div>
												</div>
												<div class="item_wrap">
													<div class="drag_item drag_obj drag_obj12">사</div>
												</div>
											</div>

											<!-- 채점 버튼 및 캐릭터 -->
											<div class="grading_area">
												<button class="grading_btn">채점하기</button>
												<div class="cha"></div>
												<div class="bubble bubble01">
													<span
														>채점하기 전에 <br />
														답을 맞게 입력했는지 <br />
														확인해 보아요.
													</span>
												</div>
											</div>

											<div class="final_obj">
												<div class="final_cha"></div>
												<button class="final_btn">다 했어요</button>

												<div class="next_section_btn">
													<button class="next_action_btn">다음 활동하기</button>
												</div>
											</div>
										</div>
									</div>

									<div class="arrow right" style="cursor: pointer"></div>
								</div>
							</div>
						</div>

						<!-- 활동2 페이지 -->
						<div class="action_page action_page02 off">
							<button class="btn_sound"></button>
							<div class="action_title">
								<span>이 단원에서 성취한 내용을 점검해 봅시다.</span>
								<button class="home_btn hide">처음으로</button>
							</div>
							<div class="action_contents">
								<div class="finger_ani"></div>
								<ul>
									<li>
										<label for="inspection01">
											<input type="checkbox" id="inspection01" />
											<span class="inspection_box"></span>
											<span class="inspection_txt">생활 공간을 청결하게 하는 과정을 경험하였어요. </span>
										</label>
									</li>
									<li>
										<label for="inspection02">
											<input type="checkbox" id="inspection02" />
											<span class="inspection_box"></span>
											<span class="inspection_txt">생활 자원의 사용 가치를 높이는 방법을 탐색하고, 생활 자원을 합리적으로 관리할 수 있어요. </span>
										</label>
									</li>
									<li>
										<label for="inspection03">
											<input type="checkbox" id="inspection03" />
											<span class="inspection_box"></span>
											<span class="inspection_txt">생활 자원을 소중하게 여기는 태도를 배웠어요. </span>
										</label>
									</li>
									<li>
										<label for="inspection04">
											<input type="checkbox" id="inspection04" />
											<span class="inspection_box"></span>
											<span class="inspection_txt">쾌적한 생활 공간을 유지하기 위해 노력할 수 있어요. </span>
										</label>
									</li>
									<li>
										<label for="inspection05">
											<input type="checkbox" id="inspection05" />
											<span class="inspection_box"></span>
											<span class="inspection_txt">음식을 마련하는 과정을 체험했어요. </span>
										</label>
									</li>
									<li>
										<label for="inspection06">
											<input type="checkbox" id="inspection06" />
											<span class="inspection_box"></span>
											<span class="inspection_txt">생활 속 의생활 문제를 해결할 수 있어요. </span>
										</label>
									</li>
								</ul>

								<!-- 페이지 업다운 버튼(텍스트 길어질 때) -->
								<!-- <div class="up_down_btn_wrap">
                  <button class="up_btn"></button>
                  <button class="down_btn"></button>
                </div> -->

								<div class="complete_obj hide">
									<button class="final_btn">다 했어요</button>
									<div class="final_cha02"></div>
								</div>
							</div>

							<!-- 토스트 팝업 -->
							<div class="toast_popup">
								<div class="inner">
									<span class="toast_popup_title">정말 다 했나요?</span>
									<div class="btn_wrap">
										<button class="yes_btn">네</button>
										<button class="no_btn">아니요</button>
									</div>
								</div>
							</div>

							<div class="complete_bg">
								<img src="./img/complete_bg.gif" alt="팡파레 GIF" />
								<div class="complete_stamp"></div>
								<p class="complete-comment"></p>
							</div>
						</div>

						<!-- 변경되는 컨텐츠 끝 -->
					</div>
				</div>
			</div>

			<!-- 복수개의 스타일 가능 -->
			<link rel="stylesheet" type="text/css" href="./common/css/common.css" />
			<link rel="stylesheet" type="text/css" href="./css/common.css" />
			<link rel="stylesheet" type="text/css" href="./css/variable.css" />

			<!-- 복수개의 스크립트 파일 가능 -->
			<script type="text/javascript" src="./common/js/jquery-3.4.1.min.js"></script>
			<script type="text/javascript" src="./common/js/jquery-ui.js"></script>
			<script type="text/javascript" src="./common/js/jquery.ui.touch-punch.min.js"></script>
			<script type="text/javascript" src="./common/js/base.js"></script>
			<script type="text/javascript" src="./common/js/view.js"></script>
			<script type="text/javascript" src="./common/js/lib.js"></script>
			<script type="text/javascript" src="./common/js/audioPlayer.js"></script>
			<script type="text/javascript" src="./common/js/common.js"></script>
			<script type="text/javascript" src="./js/sound.js"></script>
			<script type="text/javascript" src="./js/drag.js"></script>
			<script type="text/javascript" src="./js/scripts.js"></script>
		</template>

		<script type="module" src="./common/js/shadow-dom-your.js"></script>
		<script type="module" src="./js/magnifirePage/index.js"></script>
		<!-- Page js -->
	</body>
</html>
